<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Ticket System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="dashboard-container">
        <header>
            <h1>Support Ticketing System</h1>
        </header>

        <section class="ticket-form-card">
            <h2>Create New Ticket</h2>
            <form id="ticketForm">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" class="form-control" placeholder="Brief summary of the issue" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" class="form-control" rows="3" placeholder="Detailed description..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select id="priority" class="form-control">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                        <option value="Urgent">Urgent</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="createdBy">Your Name</label>
                    <input type="text" id="createdBy" class="form-control" placeholder="e.g. Alice" required>
                </div>
                <button type="submit" class="btn">Submit Ticket</button>
            </form>
        </section>

        <section>
            <h2>All Tickets</h2>
            <div id="ticketGrid" class="ticket-grid">
                </div>
        </section>
    </div>

    <script>
        // Import or paste your Ticket & TicketingSystem classes here
        class Ticket {
            constructor(id, title, description, priority = 'Medium', createdBy) {
                this.id = id;
                this.title = title;
                this.description = description;
                this.priority = priority;
                this.status = 'Open';
                this.createdBy = createdBy;
                this.assignedTo = null;
                this.createdAt = new Date();
                this.comments = [];
            }
            assign(agent) { this.assignedTo = agent; this.status = 'In Progress'; }
            updateStatus(newStatus) { this.status = newStatus; }
        }

        class TicketingSystem {
            constructor() {
                this.tickets = [];
                this.counter = 1;
            }
            createTicket(title, description, priority, createdBy) {
                const ticket = new Ticket(this.counter++, title, description, priority, createdBy);
                this.tickets.push(ticket);
                return ticket;
            }
            getAllTickets() { return this.tickets; }
        }

        // Initialize System & Mock Data
        const system = new TicketingSystem();
        system.createTicket('Cannot connect to VPN', 'Getting error 691 when attempting connection.', 'High', 'Bob');
        system.createTicket('Password Reset', 'Need a reset link for my corporate account.', 'Medium', 'Charlie');

        // DOM Elements
        const ticketForm = document.getElementById('ticketForm');
        const ticketGrid = document.getElementById('ticketGrid');

        function renderTickets() {
            ticketGrid.innerHTML = '';
            const tickets = system.getAllTickets();

            if (tickets.length === 0) {
                ticketGrid.innerHTML = '<p class="text-muted">No tickets found.</p>';
                return;
            }

            tickets.forEach(ticket => {
                const card = document.createElement('div');
                card.className = 'ticket-card';
                
                // Format status class name for badge
                const statusClass = `badge-${ticket.status.toLowerCase().replace(' ', '-')}`;

                card.innerHTML = `
                    <div>
                        <div class="ticket-header">
                            <div>
                                <span class="ticket-id">#${ticket.id}</span>
                                <h3 class="ticket-title">${escapeHTML(ticket.title)}</h3>
                            </div>
                            <span class="badge ${statusClass}">${ticket.status}</span>
                        </div>
                        <p class="ticket-desc">${escapeHTML(ticket.description)}</p>
                    </div>
                    <div class="ticket-footer">
                        <span>By: ${escapeHTML(ticket.createdBy)}</span>
                        <span>Priority: <strong>${ticket.priority}</strong></span>
                    </div>
                `;
                ticketGrid.appendChild(card);
            });
        }

        // Handle Form Submission
        ticketForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const priority = document.getElementById('priority').value;
            const createdBy = document.getElementById('createdBy').value;

            system.createTicket(title, description, priority, createdBy);
            ticketForm.reset();
            renderTickets();
        });

        // Helper to prevent basic XSS
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Initial Render
        renderTickets();
    </script>
</body>
</html>
