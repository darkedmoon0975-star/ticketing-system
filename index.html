<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Ticket System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- LOGIN SECTION -->
    <div id="loginSection" class="auth-container">
        <h2>System Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username or Name</label>
                <input type="text" id="username" class="form-control" placeholder="Enter your name (e.g., Alice)" required>
            </div>
            <div class="form-group">
                <label for="role">Role</label>
                <select id="role" class="form-control">
                    <option value="Customer">Customer</option>
                    <option value="Support Agent">Support Agent</option>
                </select>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Log In</button>
        </form>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboardSection" class="dashboard-container hidden">
        <header>
            <h1>Support Ticketing System</h1>
            <div class="user-info">
                <span id="welcomeUser" style="font-weight: 500;"></span>
                <button id="logoutBtn" class="btn btn-logout">Log Out</button>
            </div>
        </header>

        <section class="ticket-form-card">
            <h2>Create New Ticket</h2>
            <form id="ticketForm">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" class="form-control" placeholder="Brief summary of the issue" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" class="form-control" rows="3" placeholder="Detailed description..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select id="priority" class="form-control">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                        <option value="Urgent">Urgent</option>
                    </select>
                </div>
                <button type="submit" class="btn">Submit Ticket</button>
            </form>
        </section>

        <section>
            <h2>All Tickets</h2>
            <div id="ticketGrid" class="ticket-grid"></div>
        </section>
    </div>

    <script>
        class Ticket {
            constructor(id, title, description, priority = 'Medium', createdBy) {
                this.id = id;
                this.title = title;
                this.description = description;
                this.priority = priority;
                this.status = 'Open';
                this.createdBy = createdBy;
                this.assignedTo = null;
                this.createdAt = new Date();
                this.comments = [];
            }
        }

        class TicketingSystem {
            constructor() {
                this.tickets = [];
                this.counter = 1;
            }
            createTicket(title, description, priority, createdBy) {
                const ticket = new Ticket(this.counter++, title, description, priority, createdBy);
                this.tickets.push(ticket);
                return ticket;
            }
            getAllTickets() { return this.tickets; }
        }

        const system = new TicketingSystem();
        system.createTicket('Cannot connect to VPN', 'Getting error 691 when attempting connection.', 'High', 'Bob');

        const loginSection = document.getElementById('loginSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const loginForm = document.getElementById('loginForm');
        const logoutBtn = document.getElementById('logoutBtn');
        const welcomeUser = document.getElementById('welcomeUser');
        const ticketForm = document.getElementById('ticketForm');
        const ticketGrid = document.getElementById('ticketGrid');

        function checkAuth() {
            const currentUser = sessionStorage.getItem('currentUser');
            const currentRole = sessionStorage.getItem('currentRole');

            if (currentUser) {
                loginSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
                welcomeUser.textContent = `Welcome, ${currentUser} (${currentRole})`;
                renderTickets();
            } else {
                loginSection.classList.remove('hidden');
                dashboardSection.classList.add('hidden');
            }
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const role = document.getElementById('role').value;
            if (username) {
                sessionStorage.setItem('currentUser', username);
                sessionStorage.setItem('currentRole', role);
                loginForm.reset();
                checkAuth();
            }
        });

        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem('currentUser');
            sessionStorage.removeItem('currentRole');
            checkAuth();
        });

        function renderTickets() {
            ticketGrid.innerHTML = '';
            const tickets = system.getAllTickets();
            if (tickets.length === 0) {
                ticketGrid.innerHTML = '<p class="text-muted">No tickets found.</p>';
                return;
            }
            tickets.forEach(ticket => {
                const card = document.createElement('div');
                card.className = 'ticket-card';
                const statusClass = `badge-${ticket.status.toLowerCase().replace(' ', '-')}`;
                card.innerHTML = `
                    <div>
                        <div class="ticket-header">
                            <div>
                                <span class="ticket-id">#${ticket.id}</span>
                                <h3 class="ticket-title">${escapeHTML(ticket.title)}</h3>
                            </div>
                            <span class="badge ${statusClass}">${ticket.status}</span>
                        </div>
                        <p class="ticket-desc">${escapeHTML(ticket.description)}</p>
                    </div>
                    <div class="ticket-footer">
                        <span>By: ${escapeHTML(ticket.createdBy)}</span>
                        <span>Priority: <strong>${ticket.priority}</strong></span>
                    </div>
                `;
                ticketGrid.appendChild(card);
            });
        }

        ticketForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const priority = document.getElementById('priority').value;
            const createdBy = sessionStorage.getItem('currentUser') || 'Anonymous';

            system.createTicket(title, description, priority, createdBy);
            ticketForm.reset();
            renderTickets();
        });

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        checkAuth();
    </script>
</body>
</html>
