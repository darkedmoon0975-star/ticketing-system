<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Help Desk Ticketing System</title>
    <style>
        :root {
            --bg-canvas: #0d1117;
            --bg-surface: #161b22;
            --border-color: #30363d;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent: #238636;
            --accent-hover: #2ea043;
            --danger: #da3633;
            --btn-bg: #21262d;
            --btn-border: #363b42;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
        }

        .hidden {
            display: none !important;
        }

        /* Login Screen Layout */
        #loginSection {
            margin: auto;
            background: var(--bg-surface);
            padding: 30px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            max-width: 380px;
        }

        h2, h3 {
            color: var(--text-main);
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.875rem;
            color: var(--text-main);
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 8px 12px;
            background-color: var(--bg-canvas);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
        }

        button {
            width: 100%;
            padding: 8px 16px;
            background-color: var(--accent);
            color: white;
            border: 1px solid rgba(27, 31, 36, 0.15);
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        /* Dashboard GitHub Layout */
        #dashboardSection {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* Sidebar */
        aside {
            width: 260px;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-brand {
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.875rem;
            color: var(--text-main);
            cursor: pointer;
        }

        .nav-item:hover, .nav-item.active {
            background-color: rgba(177, 186, 196, 0.12);
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 60px;
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .user-info {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .content-body {
            padding: 24px;
            max-width: 1000px;
            width: 100%;
        }

        .logout-btn {
            width: auto;
            background-color: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-main);
            padding: 5px 12px;
            font-size: 0.85rem;
        }

        .logout-btn:hover {
            background-color: #30363d;
        }

        .ticket-form-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 24px;
        }

        .ticket-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ticket-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .ticket-card:hover {
            border-color: #8b949e;
        }

        .ticket-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #58a6ff;
            margin-bottom: 4px;
        }

        .ticket-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .ticket-footer {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 6px;
            display: flex;
            gap: 15px;
        }

        .badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .badge-open {
            background-color: rgba(35, 134, 54, 0.2);
            color: #3fb950;
            border: 1px solid rgba(35, 134, 54, 0.4);
        }

        .text-muted {
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- Login Section -->
    <div id="loginSection">
        <h2>System Login</h2>
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="e.g., dave" autocomplete="off">
        </div>
        <div class="form-group">
            <label for="role">Role</label>
            <select id="role">
                <option value="Customer">Customer</option>
                <option value="Support Agent">Support Agent</option>
            </select>
        </div>
        <button type="button" id="loginBtn">Sign in</button>
    </div>

    <!-- Dashboard Section (GitHub Dark UI) -->
    <div id="dashboardSection" class="hidden">
        <aside>
            <div class="sidebar-brand">
                <span>⚡ IT Ticketing</span>
            </div>
            <ul class="nav-list">
                <li class="nav-item active">Issues / Tickets</li>
                <li class="nav-item">Create Issue</li>
                <li class="nav-item">System Logs</li>
            </ul>
        </aside>

        <div class="main-content">
            <header>
                <div>
                    <span id="welcomeUser" class="user-info">Signed in as</span>
                </div>
                <button id="logoutBtn" class="logout-btn">Sign out</button>
            </header>

            <div class="content-body">
                <div class="ticket-form-box">
                    <h3>New Issue</h3>
                    <form id="ticketForm">
                        <div class="form-group">
                            <label for="title">Title</label>
                            <input type="text" id="title" placeholder="Brief summary of issue" required>
                        </div>
                        <div class="form-group">
                            <label for="description">Comment / Description</label>
                            <textarea id="description" rows="3" placeholder="Leave a comment..." required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="priority">Priority</label>
                            <select id="priority">
                                <option value="Low">Low</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="High">High</option>
                                <option value="Critical">Critical</option>
                            </select>
                        </div>
                        <button type="submit" style="width: auto;">Submit new issue</button>
                    </form>
                </div>

                <h3>Open Issues</h3>
                <div id="ticketGrid" class="ticket-grid">
                    <!-- Dynamic tickets load here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        class Ticket {
            constructor(id, title, description, priority = 'Medium', createdBy) {
                this.id = id;
                this.title = title;
                this.description = description;
                this.priority = priority;
                this.status = 'Open';
                this.createdBy = createdBy;
                this.createdAt = new Date();
            }
        }

        class TicketingSystem {
            constructor() {
                this.tickets = [];
                this.counter = 1;
            }
            createTicket(title, description, priority, createdBy) {
                const ticket = new Ticket(this.counter++, title, description, priority, createdBy);
                this.tickets.push(ticket);
                return ticket;
            }
            getAllTickets() {
                return this.tickets;
            }
        }

        const system = new TicketingSystem();
        system.createTicket('Cannot connect to VPN', 'Getting error 691 when attempting connection.', 'High', 'Bob');
        system.createTicket('Password Reset', 'Need a reset link for my corporate account.', 'Medium', 'Charlie');

        const loginSection = document.getElementById('loginSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const welcomeUser = document.getElementById('welcomeUser');
        const ticketForm = document.getElementById('ticketForm');
        const ticketGrid = document.getElementById('ticketGrid');

        function checkAuth() {
            const currentUser = sessionStorage.getItem('currentUser');
            const currentRole = sessionStorage.getItem('currentRole');

            if (currentUser && loginSection && dashboardSection) {
                loginSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
                if (welcomeUser) {
                    welcomeUser.textContent = `Signed in as ${currentUser} (${currentRole})`;
                }
                renderTickets();
            } else if (loginSection && dashboardSection) {
                loginSection.classList.remove('hidden');
                dashboardSection.classList.add('hidden');
            }
        }

        if (loginBtn) {
            loginBtn.addEventListener('click', () => {
                const usernameInput = document.getElementById('username');
                const roleInput = document.getElementById('role');
                if (usernameInput) {
                    const username = usernameInput.value.trim();
                    const role = roleInput ? roleInput.value : 'Customer';
                    if (username !== '') {
                        sessionStorage.setItem('currentUser', username);
                        sessionStorage.setItem('currentRole', role);
                        checkAuth();
                    } else {
                        alert('Please enter a username');
                    }
                }
            });
        }

        if (logoutBtn) {
            logoutBtn.addEventListener('click', () => {
                sessionStorage.removeItem('currentUser');
                sessionStorage.removeItem('currentRole');
                checkAuth();
            });
        }

        function renderTickets() {
            if (!ticketGrid) return;
            ticketGrid.innerHTML = '';
            const tickets = system.getAllTickets();

            if (tickets.length === 0) {
                ticketGrid.innerHTML = '<p class="text-muted">No open issues found.</p>';
                return;
            }

            tickets.forEach(ticket => {
                const card = document.createElement('div');
                card.className = 'ticket-card';
                const statusClass = `badge-${ticket.status.toLowerCase().replace(' ', '-')}`;

                card.innerHTML = `
                    <div>
                        <div class="ticket-title">#${ticket.id} ${escapeHTML(ticket.title)}</div>
                        <div class="ticket-desc">${escapeHTML(ticket.description)}</div>
                        <div class="ticket-footer">
                            <span>Opened by ${escapeHTML(ticket.createdBy)}</span>
                            <span>Priority: <strong>${ticket.priority}</strong></span>
                        </div>
                    </div>
                    <span class="badge ${statusClass}">${ticket.status}</span>
                `;

                card.addEventListener('click', () => {
                    alert(`Issue #${ticket.id}: ${ticket.title}\n\n${ticket.description}\n\nPriority: ${ticket.priority}`);
                });

                ticketGrid.appendChild(card);
            });
        }

        if (ticketForm) {
            ticketForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const titleInput = document.getElementById('title');
                const descInput = document.getElementById('description');
                const priorityInput = document.getElementById('priority');

                if (!titleInput || !descInput || !priorityInput) return;

                const title = titleInput.value.trim();
                const description = descInput.value.trim();
                const priority = priorityInput.value;
                const createdBy = sessionStorage.getItem('currentUser') || 'Anonymous';

                if (title && description) {
                    system.createTicket(title, description, priority, createdBy);
                    ticketForm.reset();
                    renderTickets();
                }
            });
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
        });
    </script>
</body>
</html>
